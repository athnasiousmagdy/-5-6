<style>
:root{--ink:#173b35;--muted:#60746e;--paper:#f5f7f3;--white:#fff;--green:#236b56;--mint:#e4f2e9;--gold:#e9b858;--red:#ae4848;--line:#dce6df;--shadow:0 12px 35px #173b3510}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:var(--paper);color:var(--ink);min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:12px;padding:11px 17px;background:var(--green);color:white;font-weight:700}button.secondary{background:#edf2ee;color:var(--ink);border:1px solid var(--line)}button.danger{background:#fff0ee;color:var(--red)}button:disabled{opacity:.5;cursor:not-allowed}.wrap{max-width:1100px;margin:auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 0}.brand{display:flex;align-items:center;gap:13px}.logo{width:62px;height:62px;border-radius:18px;background:var(--mint);object-fit:contain;display:grid;place-items:center;font-size:29px}.brand h1{font-size:21px;margin:0 0 5px}.brand p{margin:0;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.card{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:var(--shadow);margin:14px 0}.hero{background:linear-gradient(125deg,#173b35,#2d755e);color:#fff;padding:36px;border-radius:24px;margin:16px 0}.hero h2{font-size:28px;margin:0 0 10px}.hero p{opacity:.85;line-height:1.8;margin:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.field{display:grid;gap:7px;margin:12px 0}.field label{font-weight:bold;font-size:14px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;background:white;color:var(--ink)}.row{display:flex;align-items:center;gap:9px;flex-wrap:wrap}.note{padding:13px 15px;border-radius:12px;background:#f0f5f0;color:var(--muted);line-height:1.65;margin:10px 0}.note.error{background:#fff0ee;color:var(--red)}.note.ok{background:#e5f4ea;color:#246344}.hidden{display:none!important}.controls-hidden button{display:none!important}.tabs{display:flex;gap:8px;overflow:auto;margin:12px 0}.tabs button{white-space:nowrap}.tabs button.active{background:var(--ink)}table{width:100%;border-collapse:collapse;min-width:720px}th,td{padding:11px;border-bottom:1px solid var(--line);text-align:right;font-size:13px}th{background:#f5f8f5} .scroll{overflow:auto}.pill{padding:5px 9px;border-radius:99px;background:var(--mint);font-size:12px}.qbox{max-width:760px;margin:24px auto}.timer{font-size:28px;font-weight:bold;color:#b1781e}.progress{height:8px;background:#e7eee8;border-radius:8px;overflow:hidden}.progress i{height:100%;display:block;background:var(--green);transition:width .3s}.option{display:block;width:100%;text-align:right;margin:9px 0;background:#f4f7f4;color:var(--ink);border:1px solid var(--line)}.option.selected{border-color:var(--green);background:var(--mint)}.question{font-size:22px;line-height:1.7}.small{font-size:12px;color:var(--muted)}h2,h3{margin-top:0}#toast{position:fixed;bottom:18px;left:18px;z-index:20;max-width:90vw}.auth{max-width:520px;margin:50px auto}@media(max-width:600px){.wrap{padding:12px}.top{align-items:flex-start}.hero{padding:25px}.hero h2{font-size:23px}.card{padding:17px}.brand h1{font-size:17px}}
</style></head><body><div class="wrap">
<header class="top"><div class="brand"><img id="logo" class="logo hidden" alt="لوجو المسابقة"><div id="logoEmoji" class="logo">🏆</div><div><h1>مسابقة أبطال المعرفة</h1><p>الصف الخامس والسادس الابتدائي</p></div></div><div class="actions controls-hidden" id="headerControls"><button class="secondary" id="settingsBtn">الإعدادات</button><button class="secondary" id="adminBtn">لوحة الأدمن</button></div></header>

<script>
const $=s=>document.querySelector(s), app=$('#app'), store={url:'quiz_sb_url',key:'quiz_sb_key',logo:'quiz_logo'}, defaultSupabase={url:'https://xolrfdehveuhsxnmchcx.supabase.co',key:'sb_publishable_F0JQVNsX6AEopTCYjjnjag_yubSUzfV'};let sb=null,grade=5,round=null,student=null,questions=[],answers=[],qi=0,seconds=0,timer=null,started=null,attemptId=null,tabSwitches=0,admin=false;
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function toast(s,err=false){let t=$('#toast');t.textContent=s;t.className='note '+(err?'error':'ok');setTimeout(()=>t.className='hidden',3200)}function cfg(){let u=localStorage.getItem(store.url)||defaultSupabase.url,k=localStorage.getItem(store.key)||defaultSupabase.key;if(!u||!k)return false;try{sb=window.supabase.createClient(u,k);return true}catch(e){toast('تحقق من رابط المشروع والمفتاح',true);return false}}function applyLogo(){let x=localStorage.getItem(store.logo);if(x){$('#logo').src=x;$('#logo').classList.remove('hidden');$('#logoEmoji').classList.add('hidden')}}applyLogo();
let logoTapCount=0,logoTapTimer=null;function onLogoTap(){logoTapCount++;clearTimeout(logoTapTimer);if(logoTapCount>=3){$('#headerControls').classList.remove('controls-hidden');logoTapCount=0;toast('ظهرت أدوات الإدارة والإعدادات')}else logoTapTimer=setTimeout(()=>logoTapCount=0,1600)}$('#logo').onclick=onLogoTap;$('#logoEmoji').onclick=onLogoTap;
function settings(){app.innerHTML=`<section class="card"><h2>إعداد اتصال Supabase</h2><p class="small">المسابقة متصلة افتراضياً بقاعدة البيانات. يمكنك تغيير Project URL أو Publishable key هنا، وسيتم حفظهما على هذا الجهاز.</p><div class="field"><label>Supabase Project URL</label><input id="url" type="url" placeholder="https://xxxx.supabase.co" value="${esc(localStorage.getItem(store.url)||defaultSupabase.url)}"></div><div class="field"><label>Anon / Publishable Key</label><input id="key" type="password" value="${esc(localStorage.getItem(store.key)||defaultSupabase.key)}"></div><div class="row"><button id="saveCfg">حفظ والتحقق</button><button class="secondary" id="back">العودة</button></div><hr><h3>لوجو المسابقة</h3><div class="row"><button class="secondary" id="uploadLogo">رفع صورة</button><button class="secondary" id="clearLogo">إزالة اللوجو</button></div><p class="small">تُحفظ صورة اللوجو محلياً في المتصفح.</p><div id="cfgStatus" class="note"></div></section>`;$('#saveCfg').onclick=async()=>{let u=$('#url').value.trim(),k=$('#key').value.trim();if(!u||!k)return toast('أدخل الرابط والمفتاح',true);try{let parsed=new URL(u);if(parsed.protocol!=='https:')throw 0;localStorage.setItem(store.url,u);localStorage.setItem(store.key,k);cfg();$('#cfgStatus').textContent='تم حفظ بيانات الاتصال. جارٍ تجربة الوصول إلى قاعدة البيانات...';let {error}=await sb.from('rounds').select('id').limit(1);$('#cfgStatus').textContent=error?'تم الحفظ؛ تعذر الوصول إلى جدول rounds: '+error.message:'الاتصال يعمل بنجاح.'}catch(e){$('#cfgStatus').textContent='تعذر التحقق من الرابط. تأكد من صيغة Project URL.'}};$('#back').onclick=home;$('#uploadLogo').onclick=()=>$('#logoFile').click();$('#clearLogo').onclick=()=>{localStorage.removeItem(store.logo);applyLogo();toast('تمت إزالة اللوجو')};};$('#logoFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;if(f.size>1500000)return toast('حجم الصورة يجب ألا يتجاوز 1.5 MB',true);let r=new FileReader;r.onload=()=>{localStorage.setItem(store.logo,r.result);applyLogo();toast('تم تحديث اللوجو')};r.readAsDataURL(f)};$('#settingsBtn').onclick=settings;
function home(){if(!cfg()){app.innerHTML='<section class="card"><h2>المسابقة غير جاهزة على هذا الجهاز</h2><p>اضغط على اللوجو 3 مرات لإظهار إعدادات الاتصال.</p></section>';return}app.innerHTML=`<section class="hero"><h2>مستعد للتحدي؟</h2><p>اختر صفك واسمك، ثم ابدأ المسابقة في موعدها. اقرأ كل سؤال جيداً وأجب قبل انتهاء الوقت.</p></section><section class="card"><h2>دخول الطالب</h2><div class="grid"><div class="field"><label>اختر الصف</label><select id="grade"><option value="5">الصف الخامس الابتدائي</option><option value="6">الصف السادس الابتدائي</option></select></div><div class="field"><label>الجولة</label><select id="round"><option value="">جارٍ تحميل الجولات...</option></select></div><div class="field"><label>اسم الطالب</label><select id="student"><option value="">اختر الصف والجولة أولاً</option></select></div></div><div class="row"><button id="enter">متابعة</button><button class="secondary" id="register">اسمي مش موجود - سجل اسمك الآن</button></div><div id="loginMsg"></div></section>`;grade=5;loadRounds();$('#grade').onchange=()=>{grade=Number($('#grade').value);loadRounds()};$('#round').onchange=loadStudents;$('#register').onclick=registerStudent;$('#enter').onclick=enterExam}
async function loadRounds(){try{let {data,error}=await sb.from('rounds').select('*').eq('is_active',true).order('starts_at',{ascending:false});if(error)throw error;let el=$('#round');data=data.filter(r=>r.is_shared===true||Number(r.grade)===Number($('#grade').value));el.innerHTML=data.length?data.map(r=>`<option value="${esc(r.id)}">${esc(r.title)} — ${r.is_shared?'للصفين':Number(r.grade)===5?'الخامس':'السادس'}</option>`).join(''):'<option value="">لا توجد جولات متاحة</option>';el.onchange=loadStudents;loadStudents()}catch(e){if((e.message||'').toLowerCase().includes('invalid api key')&&localStorage.getItem(store.key)!==defaultSupabase.key){localStorage.setItem(store.url,defaultSupabase.url);localStorage.setItem(store.key,defaultSupabase.key);cfg();return loadRounds()}$('#loginMsg').innerHTML=`<div class="note error">تعذر تحميل الجولات: ${e.code==='42501'?'صلاحية قراءة جدول rounds مفقودة. شغّل ملف supabase_repair_permissions.sql في Supabase SQL Editor ثم أعد تحميل الصفحة.':esc(e.message)}. تحقق من إعداد الجداول وسياسات الوصول.</div>`}}
let studentsRequest=0;
async function loadStudents(){let sel=$('#student');if(!sel)return;let selectedGrade=Number($('#grade')?.value||grade),request=++studentsRequest;grade=selectedGrade;round=$('#round')?.value||null;sel.innerHTML='<option value="">جارٍ تحميل الأسماء...</option>';try{let {data,error}=await sb.from('students').select('id,full_name,grade').order('full_name');if(error)throw error;if(request!==studentsRequest||Number($('#grade')?.value||grade)!==selectedGrade)return;let sameGrade=(data||[]).filter(s=>{let value=String(s.grade??'').trim();return value===String(selectedGrade)||Number(value)===selectedGrade});sel.innerHTML='<option value="">اختر اسمك</option>'+sameGrade.map(s=>`<option value="${esc(s.id)}">${esc(s.full_name)}</option>`).join('');let msg=$('#loginMsg');if(msg){if(sameGrade.length)msg.innerHTML=`<div class="note ok">تم تحميل ${sameGrade.length} اسمًا للصف ${selectedGrade}.</div>`;else msg.innerHTML=`<div class="note">لا توجد أسماء مسجلة للصف ${selectedGrade} في جدول students. استخدم زر التسجيل الذاتي أو اطلب من الأدمن استيراد القائمة.</div>`}}catch(e){if(request!==studentsRequest)return;sel.innerHTML='<option value="">تعذر تحميل الأسماء</option>';let msg=$('#loginMsg');if(msg)msg.innerHTML=`<div class="note error">تعذر قراءة جدول الطلاب من Supabase: ${esc(e.message)}. راجع سياسة SELECT العامة لجدول students ومفتاح Publishable/Anon.</div>`}}
async function registerStudent(){grade=Number($('#grade').value);let full_name=prompt('اكتب اسمك الكامل:');if(!full_name||!full_name.trim())return;try{let {data:dup,error:de}=await sb.from('students').select('id').eq('grade',String(grade)).ilike('full_name',full_name.trim()).limit(1);if(de)throw de;if(dup.length){toast('الاسم مسجل بالفعل، اختره من القائمة.',true);await loadStudents();return}let {data,error}=await sb.from('students').insert({grade:String(grade),full_name:full_name.trim(),is_self_registered:1,group_name:'',score:0,max_score:0,time_taken_seconds:0,is_active:true}).select().single();if(error)throw error;await loadStudents();$('#student').value=data.id;student=data;toast('تم تسجيل اسمك. جارٍ فتح المسابقة.');await enterExam()}catch(e){toast('لم يتم التسجيل: '+e.message,true)}}
function normalizeQuestion(q){return{...q,options:[q.option_a,q.option_b,q.option_c,q.option_d].filter(v=>v!==null&&v!==undefined&&v!==''),time_limit_seconds:q.time_limit_sec}}function fmt(d){return new Date(d).toLocaleString('ar-EG',{dateStyle:'long',timeStyle:'short'})}async function enterExam(){grade=Number($('#grade').value);round=$('#round').value;let sid=$('#student').value;if(!round)return toast('اختر الجولة أولاً',true);if(!sid)return toast('اختر اسمك أو سجله أولاً',true);try{let [{data:r,error:re},{data:s,error:se},{data:q,error:qe}]=await Promise.all([sb.from('rounds').select('*').eq('id',round).single(),sb.from('students').select('*').eq('id',sid).single(),sb.from('questions').select('*').eq('round_id',round).order('sort_order')]);if(re)throw re;if(se)throw se;if(qe)throw qe;q=(q||[]).map(normalizeQuestion);if(!r.is_shared&&Number(r.grade)!==grade)return toast('هذه الجولة مخصصة لصف آخر.',true);let now=Date.now();if(now<new Date(r.starts_at).getTime())return $('#loginMsg').innerHTML=`<div class="note">تفتح المسابقة في ${fmt(r.starts_at)}.</div>`;if(now>new Date(r.ends_at).getTime()){app.innerHTML=`<section class="card"><h2>انتهت فترة المسابقة</h2><p>انتهى موعد الجولة في ${fmt(r.ends_at)}.</p>${r.show_model_answer_after_end?`<button id="answers">عرض نموذج الإجابة</button>`:''}</section>`;if(r.show_model_answer_after_end)$('#answers').onclick=()=>showAnswerKey(q);return}if(!q?.length)return toast('لا توجد أسئلة لهذه الجولة حتى الآن.',true);student=s;questions=q;answers=Array(q.length).fill(null);started=new Date().toISOString();tabSwitches=0;attemptId=crypto.randomUUID();let {data:startedId,error:ae}=await sb.rpc('start_quiz_submission',{p_id:attemptId,p_student_id:s.id,p_round_id:r.id,p_grade:grade,p_started_at:started,p_max_score:q.length});if(ae)throw ae;if(startedId)attemptId=startedId;window.addEventListener('blur',onBlur);document.addEventListener('visibilitychange',onVisibility);renderQ(0)}catch(e){toast('تعذر بدء المسابقة: '+e.message,true)}}function onBlur(){if(attemptId)tabSwitches++}function onVisibility(){if(document.hidden&&attemptId)tabSwitches++}window.addEventListener('pagehide',()=>{if(!attemptId)return;let u=localStorage.getItem(store.url),k=localStorage.getItem(store.key);if(!u||!k)return;let body={p_id:attemptId,p_started_at:started,p_submitted_at:new Date().toISOString(),p_time_taken_seconds:Math.max(0,Math.round((Date.now()-new Date(started).getTime())/1000)),p_score:calculateScore(),p_max_score:questions.length,p_tab_switches:tabSwitches,p_answers_json:answers,p_status:'abandoned'};fetch(u.replace(/\/$/,'')+'/rest/v1/rpc/finish_quiz_submission',{method:'POST',keepalive:true,headers:{apikey:k,Authorization:'Bearer '+k,'Content-Type':'application/json'},body:JSON.stringify(body)}).catch(()=>{})})
function renderQ(i){qi=i;clearInterval(timer);let q=questions[i],left=Number(q.time_limit_seconds)||30;app.innerHTML=`<section class="card qbox"><div class="row" style="justify-content:space-between"><span class="pill">${esc(student.full_name)} · ${i+1} / ${questions.length}</span><span class="timer" id="time">${left}</span></div><div class="progress" style="margin:17px 0"><i style="width:${100*i/questions.length}%"></i></div><h2 class="question">${esc(q.question_text)}</h2><div id="opts"></div><div class="row" style="justify-content:space-between;margin-top:18px"><span class="small">الوقت بالثواني</span><button id="next">${i===questions.length-1?'إنهاء المسابقة':'السؤال التالي'}</button></div></section>`;let opts=Array.isArray(q.options)?q.options:JSON.parse(q.options||'[]');if(q.question_type==='true_false')opts=['صح','غلط'];$('#opts').innerHTML=opts.map((o,j)=>`<button class="option ${answers[i]===j?'selected':''}" data-i="${j}">${esc(o)}</button>`).join('');document.querySelectorAll('.option').forEach(b=>b.onclick=()=>{answers[i]=Number(b.dataset.i);renderQ(i)});$('#next').onclick=()=>advance(false);timer=setInterval(()=>{left--;$('#time').textContent=left;if(left<=0)advance(true)},1000)}function advance(timeout){clearInterval(timer);if(qi<questions.length-1){renderQ(qi+1);return}submitExam()}
function calculateScore(){let score=0;questions.forEach((q,i)=>{let correct=String(q.correct_answer),ans=answers[i];if(ans!==null&&(correct===String(ans)||correct===String(q.options[ans])))score++});return score}async function submitExam(){clearInterval(timer);let score=calculateScore(),ended=new Date(),duration=Math.max(0,Math.round((ended-new Date(started))/1000));try{let {error}=await sb.rpc('finish_quiz_submission',{p_id:attemptId,p_started_at:started,p_submitted_at:ended.toISOString(),p_time_taken_seconds:duration,p_score:score,p_max_score:questions.length,p_tab_switches:tabSwitches,p_answers_json:answers,p_status:'completed'});if(error)throw error;attemptId=null;window.removeEventListener('blur',onBlur);document.removeEventListener('visibilitychange',onVisibility);app.innerHTML=`<section class="card qbox"><h2>أحسنت يا ${esc(student.full_name)}!</h2><p>أكملت المسابقة.</p><p>درجتك: <strong>${score} / ${questions.length}</strong></p><p class="small">المدة: ${duration} ثانية</p><button onclick="home()">العودة للرئيسية</button></section>`}catch(e){toast('تعذر حفظ النتيجة: '+e.message,true)}}function showAnswerKey(qs){app.innerHTML='<section class="card"><h2>نموذج الإجابة</h2>'+qs.map((q,i)=>`<p>${i+1}. ${esc(q.question_text)}<br><b>${esc(/^\d+$/.test(String(q.correct_answer))?(q.options[Number(q.correct_answer)]||q.correct_answer):q.correct_answer)}</b></p>`).join('')+'</section>'}
$('#adminBtn').onclick=adminPanel;async function adminPanel(){if(!cfg()){settings();return}if(!admin){app.innerHTML=`<section class="card auth"><h2>دخول الأدمن</h2><p class="small">استخدم حساب Supabase Auth المصرح له بإدارة قاعدة البيانات.</p><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password"></div><button id="loginAdmin">دخول</button><div id="authMsg"></div></section>`;$('#loginAdmin').onclick=async()=>{let {error}=await sb.auth.signInWithPassword({email:$('#email').value,password:$('#password').value});if(error)return $('#authMsg').innerHTML=`<div class="note error">${esc(error.message)}</div>`;admin=true;adminPanel()};let {data}=await sb.auth.getSession();if(data.session){admin=true;adminPanel()}return}renderAdmin('rounds')}
async function renderAdmin(tab){app.innerHTML=`<section class="card"><div class="row" style="justify-content:space-between"><h2>لوحة الأدمن</h2><button class="secondary" id="logout">تسجيل خروج</button></div><div class="tabs"><button data-tab="rounds">الجولات</button><button data-tab="questions">الأسئلة</button><button data-tab="students">الطلاب</button><button data-tab="reports">التقارير</button></div><div id="adminContent">جارٍ التحميل...</div></section>`;document.querySelectorAll('[data-tab]').forEach(b=>{b.classList.toggle('active',b.dataset.tab===tab);b.onclick=()=>renderAdmin(b.dataset.tab)});$('#logout').onclick=async()=>{await sb.auth.signOut();admin=false;$('#headerControls').classList.add('controls-hidden');home()};if(tab==='rounds')await adminRounds();if(tab==='questions')await adminQuestions();if(tab==='students')await adminStudents();if(tab==='reports')await adminReports()}
const grades='<option value="5">الخامس</option><option value="6">السادس</option>';function dt(v){if(!v)return'';let d=new Date(v);return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
async function adminRounds(){let c=$('#adminContent'),{data,error}=await sb.from('rounds').select('*').order('starts_at',{ascending:false});if(error)return c.innerHTML=`<div class="note error">${esc(error.message)}</div>`;c.innerHTML=`<h3>إنشاء جولة / تعديل موعدها</h3><div class="grid"><input id="rid" type="hidden"><div class="field"><label>اسم الجولة</label><input id="rname" placeholder="الأسبوع الأول"></div><div class="field"><label>الفئة</label><select id="rgrade"><option value="0">الصفين معاً</option>${grades}</select></div><div class="field"><label>بداية المسابقة</label><input id="start" type="datetime-local"></div><div class="field"><label>نهاية المسابقة</label><input id="end" type="datetime-local"></div></div><label><input id="showAnswers" type="checkbox"> إظهار نموذج الإجابة بعد الانتهاء</label><p><button id="saveRound">حفظ الجولة</button> <button class="secondary" id="newRound">جديد</button></p><div class="scroll"><table><thead><tr><th>الجولة</th><th>الصف</th><th>البداية</th><th>النهاية</th><th></th></tr></thead><tbody>${data.map(r=>`<tr><td>${esc(r.title)}</td><td>${r.is_shared?'الصفين معاً':r.grade===5?'الخامس':'السادس'}</td><td>${fmt(r.starts_at)}</td><td>${fmt(r.ends_at)}</td><td><button class="secondary" onclick="editRound('${esc(r.id)}')">تعديل</button> <button class="danger" onclick="deleteRecord('rounds','${esc(r.id)}',()=>renderAdmin('rounds'))">حذف</button></td></tr>`).join('')}</tbody></table></div>`;window._rounds=data;$('#newRound').onclick=()=>{['rid','rname','start','end'].forEach(id=>$('#'+id).value='');$('#rgrade').value='0';$('#showAnswers').checked=false};$('#saveRound').onclick=async()=>{if(!$('#rname').value.trim()||!$('#start').value||!$('#end').value)return toast('أكمل اسم الجولة وموعد البداية والنهاية',true);let body={title:$('#rname').value.trim(),description:'',grade:$('#rgrade').value==='0'?5:Number($('#rgrade').value),is_shared:$('#rgrade').value==='0',timer_seconds:30,starts_at:new Date($('#start').value).toISOString(),ends_at:new Date($('#end').value).toISOString(),max_tab_switches:3,show_model_answer_after_end:$('#showAnswers').checked,is_active:true,instant_feedback:false};if(new Date(body.ends_at)<=new Date(body.starts_at))return toast('موعد النهاية يجب أن يكون بعد البداية',true);let id=$('#rid').value,{error}=id?await sb.from('rounds').update(body).eq('id',id):await sb.from('rounds').insert(body);if(error)return toast(error.message,true);toast('تم حفظ الجولة');renderAdmin('rounds')}};window.editRound=id=>{let r=window._rounds.find(x=>x.id===id);$('#rid').value=id;$('#rname').value=r.title;$('#rgrade').value=r.is_shared?'0':String(r.grade);$('#start').value=dt(r.starts_at);$('#end').value=dt(r.ends_at);$('#showAnswers').checked=!!r.show_model_answer_after_end;window.scrollTo(0,0)};
async function adminQuestions(){let c=$('#adminContent');let {data:r}=await sb.from('rounds').select('*').order('starts_at',{ascending:false});if(!r?.length)return c.innerHTML='<div class="note">أنشئ جولة أولاً.</div>';c.innerHTML=`<div class="grid"><div class="field"><label>الجولة</label><select id="qr">${r.map(x=>`<option value="${esc(x.id)}">${esc(x.title)} · ${x.is_shared?'الصفين معاً':'صف '+x.grade}</option>`)}</select></div></div><div id="qform"></div><div id="qlist"></div>`;$('#qr').onchange=loadQuestions;await loadQuestions();async function loadQuestions(){let rid=$('#qr').value,ro=r.find(x=>x.id===rid);let {data:q,error}=await sb.from('questions').select('*').eq('round_id',rid).order('sort_order');if(error)return $('#qlist').innerHTML=`<div class="note error">${esc(error.message)}</div>`;q=(q||[]).map(normalizeQuestion);window._questions=q;$('#qform').innerHTML=`<h3>إضافة / تعديل سؤال</h3><input id="qid" type="hidden"><div class="field"><label>نص السؤال</label><textarea id="qtext" rows="3"></textarea></div><div class="grid"><div class="field"><label>النوع</label><select id="qtype"><option value="mcq">اختيار من متعدد</option><option value="true_false">صح وغلط</option></select></div><div class="field"><label>الوقت بالثواني</label><input id="qtime" type="number" min="5" value="30"></div><div class="field"><label>الترتيب</label><input id="qsort" type="number" value="${q.length+1}"></div></div><div class="field" id="optionsField"><label>الاختيارات (كل اختيار في سطر)</label><textarea id="qoptions" rows="4"></textarea></div><div class="field"><label>الإجابة الصحيحة (رقم الاختيار بدءاً من 0، أو نص الإجابة)</label><input id="qcorrect" placeholder="0"></div><button id="saveQ">حفظ السؤال</button> <button class="secondary" id="clearQ">جديد</button>`;$('#qtype').onchange=()=>$('#optionsField').classList.toggle('hidden',$('#qtype').value==='true_false');$('#clearQ').onclick=()=>{['qid','qtext','qoptions','qcorrect'].forEach(x=>$('#'+x).value='');$('#qtime').value=30;$('#qsort').value=q.length+1};$('#saveQ').onclick=async()=>{let type=$('#qtype').value,options=type==='true_false'?['صح','غلط']:$('#qoptions').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!$('#qtext').value.trim()||(!options.length&&type==='mcq')||!$('#qcorrect').value.trim())return toast('أكمل السؤال والاختيارات والإجابة',true);let corr=$('#qcorrect').value.trim();let correct_answer=corr;let body={round_id:rid,section_id:Number(ro.grade),question_text:$('#qtext').value.trim(),question_type:type,option_a:options[0]||null,option_b:options[1]||null,option_c:options[2]||null,option_d:options[3]||null,correct_answer,time_limit_sec:Number($('#qtime').value),sort_order:Number($('#qsort').value)};let id=$('#qid').value,{error}=id?await sb.from('questions').update(body).eq('id',id):await sb.from('questions').insert(body);if(error)return toast(error.message,true);toast('تم حفظ السؤال');loadQuestions()};$('#qlist').innerHTML='<h3>الأسئلة الموجودة ('+q.length+')</h3>'+q.map((x,i)=>`<div class="note"><b>${i+1}. ${esc(x.question_text)}</b> <span class="pill">${x.time_limit_seconds} ثانية</span><div class="row" style="margin-top:8px"><button class="secondary" onclick="editQuestion('${esc(x.id)}')">تعديل</button><button class="danger" onclick="deleteRecord('questions','${esc(x.id)}',()=>renderAdmin('questions'))">حذف</button></div></div>`).join('');window.editQuestion=id=>{let x=q.find(a=>a.id===id);$('#qid').value=id;$('#qtext').value=x.question_text;$('#qtype').value=x.question_type;$('#qtype').dispatchEvent(new Event('change'));$('#qtime').value=x.time_limit_seconds;$('#qsort').value=x.sort_order;$('#qoptions').value=(Array.isArray(x.options)?x.options:JSON.parse(x.options||'[]')).join('\n');$('#qcorrect').value=x.correct_answer;window.scrollTo(0,0)}}}
async function adminStudents(){let c=$('#adminContent');c.innerHTML=`<h3>إضافة طالب</h3><div class="grid"><div class="field"><label>الاسم الكامل</label><input id="sname"></div><div class="field"><label>الصف</label><select id="sgrade">${grades}</select></div></div><button id="addStudent">إضافة</button><hr><h3>استيراد الطلاب من CSV</h3><p class="small">اختر ملف grade_5_students.csv أو grade_6_students.csv. تُضاف الأسماء غير الموجودة فقط، ولا تُحذف أو تُستبدل سجلات.</p><input id="csv" type="file" accept=".csv,text/csv"><button id="importCsv" class="secondary">استيراد الملف</button><div id="importMsg"></div><hr><h3>قائمة الطلاب</h3><div class="grid"><label>عرض الصف <select id="filterGrade">${grades}</select></label></div><div id="studentRows"></div>`;$('#addStudent').onclick=async()=>{let {error}=await sb.from('students').insert({full_name:$('#sname').value.trim(),grade:String($('#sgrade').value),is_self_registered:0,group_name:'',score:0,max_score:0,time_taken_seconds:0,is_active:true});if(error)return toast(error.message,true);toast('تمت إضافة الطالب');load()};$('#filterGrade').onchange=load;$('#importCsv').onclick=importCsv;await load();async function load(){let {data,error}=await sb.from('students').select('*').eq('grade',String($('#filterGrade').value)).order('full_name');if(error)return $('#studentRows').innerHTML=`<div class="note error">${esc(error.message)}</div>`;$('#studentRows').innerHTML=`<div class="scroll"><table><thead><tr><th>الاسم</th><th>الصف</th><th>تسجيل ذاتي</th></tr></thead><tbody>${data.map(s=>`<tr><td>${esc(s.full_name)}</td><td>${s.grade}</td><td>${s.is_self_registered?'نعم':'لا'}</td></tr>`).join('')}</tbody></table></div>`}}
async function importCsv(){let f=$('#csv').files[0];if(!f)return toast('اختر ملف CSV أولاً',true);let text=await f.text(),rows=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(Boolean),head=rows.shift().split(',').map(x=>x.trim());let gi=head.indexOf('grade'),ni=head.indexOf('full_name');if(gi<0||ni<0)return toast('يلزم عمودا grade وfull_name',true);let parsed=rows.map(line=>{let cols=line.split(',');return{grade:String(cols[gi]),full_name:(cols[ni]||'').trim(),is_self_registered:0,group_name:'',score:0,max_score:0,time_taken_seconds:0,is_active:true}}).filter(s=>[5,6].includes(Number(s.grade))&&s.full_name);let gradesSeen=[...new Set(parsed.map(x=>x.grade))];let {data:existing,error:ee}=await sb.from('students').select('grade,full_name').in('grade',gradesSeen);if(ee)return toast(ee.message,true);let known=new Set(existing.map(s=>s.grade+'|'+s.full_name.trim().toLocaleLowerCase()));let fresh=parsed.filter(s=>{let key=s.grade+'|'+s.full_name.toLocaleLowerCase();if(known.has(key))return false;known.add(key);return true});if(!fresh.length){$('#importMsg').innerHTML='<div class="note">لا توجد أسماء جديدة؛ لم يتغير شيء.</div>';return}let {error}=await sb.from('students').insert(fresh);if(error)return toast('تعذر الاستيراد: '+error.message,true);$('#importMsg').innerHTML=`<div class="note ok">تمت إضافة ${fresh.length} طالباً، وتجاوز ${parsed.length-fresh.length} اسم مكرر. لم تُحذف أي بيانات.</div>`;load()}
async function adminReports(){let c=$('#adminContent'),{data:r,error}=await sb.from('rounds').select('*').order('starts_at',{ascending:false});if(error)return c.innerHTML=`<div class="note error">${esc(error.message)}</div>`;c.innerHTML=`<div class="grid"><div class="field"><label>الجولة</label><select id="reportRound">${r.map(x=>`<option value="${esc(x.id)}">${esc(x.title)} · صف ${x.grade}</option>`).join('')}</select></div><div class="field"><label>الصف</label><select id="reportGrade">${grades}</select></div></div><div class="row"><button id="loadReport">عرض التقرير</button><button id="csvReport" class="secondary">تصدير CSV</button><button id="printReport" class="secondary">طباعة</button></div><div id="reportRows"></div>`;if(r.length){$('#reportRound').onchange=()=>$('#reportGrade').value=r.find(x=>x.id===$('#reportRound').value).grade;$('#reportGrade').value=r[0].grade;$('#reportRound').onchange()}$('#loadReport').onclick=load;$('#csvReport').onclick=()=>{if(!window._report)return toast('اعرض التقرير أولاً',true);let csv='\ufeff'+['اسم الطالب,الصف,الحالة,بدأ في,سلّم في,المدة بالثواني,الدرجة,النهاية العظمى,مرات الخروج',...window._report.map(x=>[x.name,x.grade,x.status,x.started_at||'',x.submitted_at||'',x.time_taken_seconds??'',x.score??'',x.max_score??'',x.tab_switches??0].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(','))].join('\r\n');let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='quiz-report.csv';a.click();URL.revokeObjectURL(a.href)};$('#printReport').onclick=()=>print();async function load(){let rid=$('#reportRound').value,g=Number($('#reportGrade').value),roundObj=r.find(x=>x.id===rid);let [{data:s,error:se},{data:a,error:ae}]=await Promise.all([sb.from('students').select('*').eq('grade',String(g)).order('full_name'),sb.from('submissions').select('*').eq('round_id',rid)]);if(se||ae)return toast((se||ae).message,true);let by=new Map(a.map(x=>[x.student_id,x]));let rows=s.map(p=>{let x=by.get(p.id);return{name:p.full_name,grade:g,status:x?({'completed':'مكتمل','in_progress':'جاري الحل','abandoned':'انتهى بسبب الخروج'}[x.status]||x.status):'لم يدخل',started_at:x?.started_at?fmt(x.started_at):'',submitted_at:x?.submitted_at?fmt(x.submitted_at):'',time_taken_seconds:x?.time_taken_seconds,score:x?.score,max_score:x?.max_score,tab_switches:x?.tab_switches??0}});window._report=rows;$('#reportRows').innerHTML=`<p class="small">${esc(roundObj?.title||'')} · ${rows.filter(x=>x.status!=='لم يدخل').length} دخلوا · ${rows.filter(x=>x.status==='لم يدخل').length} لم يدخلوا</p><div class="scroll"><table><thead><tr><th>الطالب</th><th>الحالة</th><th>بدأ</th><th>سلّم</th><th>المدة</th><th>الدرجة</th><th>خروج</th></tr></thead><tbody>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.status)}</td><td>${esc(x.started_at)}</td><td>${esc(x.submitted_at)}</td><td>${x.time_taken_seconds??'—'}</td><td>${x.score??'—'} / ${x.max_score??'—'}</td><td>${x.tab_switches}</td></tr>`).join('')}</tbody></table></div>`}if(r.length)load()}
async function deleteRecord(table,id,done){if(!confirm('هل تريد حذف هذا السجل؟'))return;let {error}=await sb.from(table).delete().eq('id',id);if(error)return toast(error.message,true);toast('تم الحذف');done()}
home();
</script></body></html>
